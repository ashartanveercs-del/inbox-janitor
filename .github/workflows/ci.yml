name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests examples tools
      - run: pytest -q
      - name: Offline demo (the real CLI against a JSON mailbox)
        run: python examples/demo.py
      - name: Every safety guard has a test that fails without it
        run: python tools/mutation_check.py
      - name: Classifier precision at the floor on the labelled corpus
        run: python tools/eval_classifier.py
