[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "inbox-janitor"
version = "0.1.0"
description = "Staged-autonomy email triage: an AI that earns permissions (trial -> file -> trash) instead of being handed them, with confidence floors, spam rescue, per-run caps, undo and hash-only logs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Ashar Tanveer" }]
keywords = ["email", "gmail", "triage", "llm-agents", "ai-safety", "automation"]
dependencies = [
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
inbox-janitor = "inbox_janitor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/inbox_janitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
